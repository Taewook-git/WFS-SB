metadata:
  protocol: phasefuse-v2-dev20
  status: diagnostic_development
  baseline_method: dense_swt
  main_method: phasefuse_v2
  contribution: globally_covered_phase_marginalized_event_selection
  note: Outer origins are evaluation perturbations and are never fused.

sampling:
  master_seed: 20260813
  num_outer_origins: 5
  base_sample_fps: 1.0
  num_inner_phases: 4
  dense_sample_fps: 4.0
  pts_backend: pyav
  nearest_tie_break: earlier

phasefuse:
  methods:
    - dense_swt
    - phasefuse
    - phasefuse_v2
  frame_budget: 16
  num_phases: 4
  min_frames_per_segment: 2
  wavelet: db4
  level: null
  drift_level: 3
  dwt_mode: symmetric
  shared_padding: true
  padding_mode: reflect
  swt_norm: true
  min_boundary_distance_sec: 5.0
  boundary_threshold_mad: 0.5
  uncertainty_penalty: 0.25
  relevance_weight: 0.5
  phase_vote_weight: 0.25
  segment_duration_weight: 0.2
  segment_relevance_weight: 0.4
  segment_event_weight: 0.3
  segment_diversity_weight: 0.1
  segment_uncertainty_penalty: 0.1
  allocation_temperature: 1.0
  mmr_lambda: 0.7
  mmr_visual_weight: 0.75
  temporal_redundancy_scale_sec: 2.0
  selection_strategy: global_coverage
  uniform_reserve: 8
  selection_event_weight: 0.25
  component_scaling: percentile
  min_selection_distance_sec: 0.5
  legacy_selection:
    height_factor: 0.5
    prominence_factor: 0.05
    w_duration: 0.4
    w_mean: 0.2
    w_max: 0.3
    w_var: 0.1
    strictness_factor: 1.2
    temperature: 1.0
    lambda_param: 0.5
